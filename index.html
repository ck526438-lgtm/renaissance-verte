<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1710">
  <meta name="description" content="Renaissance Verte — survie en 3D : saisons, santé, ferme, cuisine, combat et bunkers oubliés.">
  <title>Renaissance Verte</title>
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="stylesheet" href="./src/ui/style.css">
</head>
<body>
  <div id="app">
    <canvas id="game" tabindex="0"></canvas>

    <!-- ===== HUD ===== -->
    <div id="hud" class="hidden">
      <div id="compass"><div id="compassStrip"></div><div class="tick"></div></div>
      <div id="clock" class="glass">
        <div class="cl-row"><span id="clSeason">Printemps</span><span id="clDay">Jour 1</span><span id="clTime">07:30</span></div>
        <div class="cl-row sub"><span id="clWeather">Ciel clair</span><span id="clTemp">14 °C</span></div>
      </div>
      <div id="goal" class="glass hidden"><b>Objectif</b><span id="goalTxt"></span></div>
      <div id="minimapBox" class="glass"><canvas id="minimap" width="150" height="150"></canvas><span class="mm-n">N</span></div>
      <div id="toasts"></div>
      <div id="banner"><h2></h2><p></p></div>
      <div id="crosshair"><i></i></div>
      <div id="hold"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16"/></svg></div>
      <div id="prompt">
        <div class="pr-name"></div>
        <div class="pr-info"></div>
        <div class="pr-keys"></div>
      </div>
      <div id="vitals" class="glass">
        <div class="bar vie"><i class="ico"></i><em>Vie</em><span class="track"><span class="fill"></span></span></div>
        <div class="bar faim"><i class="ico"></i><em>Faim</em><span class="track"><span class="fill"></span></span></div>
        <div class="bar soif"><i class="ico"></i><em>Soif</em><span class="track"><span class="fill"></span></span></div>
        <div class="bar energie"><i class="ico"></i><em>Énergie</em><span class="track"><span class="fill"></span></span></div>
        <div class="bar sommeil"><i class="ico"></i><em>Sommeil</em><span class="track"><span class="fill"></span></span></div>
        <div class="body"><span id="bodyTemp">37,0 °C</span><span id="feltTemp">ressenti 15 °C</span></div>
      </div>
      <div id="effects"></div>
      <div id="loot"></div>
      <div id="hotbar"></div>
      <div id="hurt"></div>
      <div id="wetfx"></div>
    </div>
    <div id="fade"></div>

    <!-- ===== Commandes tactiles ===== -->
    <div id="touch" class="hidden">
      <div id="stick"><div class="knob"></div></div>
      <div id="lookZone"></div>
      <button class="tb big" data-k="action" id="tbAction">Action</button>
      <button class="tb" data-k="interact" id="tbUse">Utiliser</button>
      <button class="tb" data-k="jump" id="tbJump">Saut</button>
      <button class="tb toggle" data-k="sprint" id="tbSprint">Courir</button>
      <div id="tbTop">
        <button class="tb sm" data-k="inventory">Sac</button>
        <button class="tb sm" data-k="craft">Fabriquer</button>
        <button class="tb sm" data-k="build">Bâtir</button>
        <button class="tb sm" data-k="map">Carte</button>
        <button class="tb sm" data-k="view">Vue</button>
        <button class="tb sm" data-k="pause">❚❚</button>
      </div>
      <div id="tbPlace" class="hidden">
        <button class="tb sm" data-k="rotate">Tourner</button>
        <button class="tb sm" data-k="cancel">Annuler</button>
      </div>
    </div>

    <!-- ===== Panneaux ===== -->
    <div id="sheet" class="hidden">
      <div class="sheet-card">
        <div class="sheet-head"><h2 id="sheetTitle"></h2><div id="sheetTabs"></div><button class="x" id="sheetClose" aria-label="Fermer">✕</button></div>
        <div id="sheetBody"></div>
      </div>
    </div>

    <!-- ===== Menus ===== -->
    <div id="menu">
      <div id="menuBg"></div>
      <div class="menu-card" id="menuCard"></div>
    </div>

    <div id="loading"><img src="./logo.png" alt=""><p>Le monde pousse…</p><div class="lbar"><i></i></div></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
