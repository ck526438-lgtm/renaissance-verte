name: Applis (Windows, macOS, Linux, Android)

on:
  push:
    tags: ['v*']
    branches: [main, refonte-3d]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Bureau (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construire le jeu (Vite)
        run: npx vite build
      - name: Construire l'installateur
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: renaissance-verte-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Construire le jeu et synchroniser Android
        run: npx vite build && npx cap sync android
      - name: Construire l'APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Renommer l'APK
        run: |
          V=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "Renaissance-Verte-$V-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: renaissance-verte-android
          path: Renaissance-Verte-*-android.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publier (version officielle sur un tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
      - name: Publier la bêta (téléchargement direct, sans compte GitHub)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-beta
          target_commitish: ${{ github.sha }}
          name: Renaissance Verte 3.0 (bêta)
          prerelease: true
          files: out/*
          body: |
            Version bêta fabriquée automatiquement depuis la branche `${{ github.ref_name }}`.

            | Système | Fichier |
            |---|---|
            | Windows (installateur) | `Renaissance-Verte-…-win-x64.exe` |
            | Windows (sans installation) | `Renaissance-Verte-…-portable.exe` |
            | macOS | `Renaissance-Verte-…-mac-….dmg` |
            | Linux | `….AppImage` ou `….deb` |
            | Android | `Renaissance-Verte-…-android.apk` |
